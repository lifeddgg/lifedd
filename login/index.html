<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Login - KIRA</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <style>
    @layer base {
      html, body {
        margin: 0;
        padding: 0;
        scroll-behavior: smooth;
        height: 100%;
        background-color: #020504 !important;
      }
      body {
        overscroll-behavior: none;
      }
    }
    ::-webkit-scrollbar { 
      display: none;
    }
    .font-manrope { font-family: 'Manrope', sans-serif; }
    .font-space-grotesk { font-family: 'Space Grotesk', sans-serif; }
    .font-inter { font-family: 'Inter', sans-serif; }
    .font-sora { font-family: 'Sora', sans-serif; }

    /* ==========================================================
       DYNAMIC MOVING SCREEN BACKGROUND (HIMMAH / AI DASHBOARD STYLE)
       ========================================================== */
    #kira-cinematic-bg {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: #020504;
      z-index: -10;
      pointer-events: none;
      overflow: hidden;
    }

    /* 1. Drifting Ambient Glow Orbs */
    .aurora-orb-1 {
      position: absolute;
      top: -20%;
      left: -10%;
      width: 60vw;
      height: 60vw;
      background: radial-gradient(circle, rgba(0, 255, 136, 0.22) 0%, rgba(5, 150, 105, 0.08) 50%, transparent 75%);
      border-radius: 50%;
      filter: blur(90px);
      animation: floatOrb1 12s ease-in-out infinite alternate;
    }

    .aurora-orb-2 {
      position: absolute;
      bottom: -20%;
      right: -10%;
      width: 65vw;
      height: 65vw;
      background: radial-gradient(circle, rgba(52, 211, 153, 0.18) 0%, rgba(4, 120, 87, 0.06) 50%, transparent 75%);
      border-radius: 50%;
      filter: blur(100px);
      animation: floatOrb2 15s ease-in-out infinite alternate;
    }

    /* 2. Moving Cyber Grid Lines across the screen */
    .cyber-grid-overlay {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(to right, rgba(0, 255, 136, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0, 255, 136, 0.03) 1px, transparent 1px);
      background-size: 60px 60px;
      animation: gridDrift 20s linear infinite;
    }

    /* 3. Sweeping Light Beam */
    .sweeping-light-beam {
      position: absolute;
      width: 200%;
      height: 200%;
      top: -50%;
      left: -50%;
      background: linear-gradient(
        45deg,
        transparent 40%,
        rgba(0, 255, 136, 0.07) 48%,
        rgba(52, 211, 153, 0.12) 50%,
        rgba(0, 255, 136, 0.07) 52%,
        transparent 60%
      );
      animation: beamSweep 8s linear infinite;
    }

    /* KEYFRAME ANIMATIONS FOR THE BACKGROUND */
    @keyframes floatOrb1 {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(15vw, 15vh) scale(1.2); }
    }

    @keyframes floatOrb2 {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(-18vw, -12vh) scale(1.25); }
    }

    @keyframes gridDrift {
      0% { background-position: 0 0; }
      100% { background-position: 60px 60px; }
    }

    @keyframes beamSweep {
      0% { transform: rotate(0deg) translateY(-20%); }
      100% { transform: rotate(360deg) translateY(-20%); }
    }

    /* Cahaya Neon Hijau Lembut di Belakang Login Card */
    .card-neon-glow-container {
      position: relative;
    }
    .card-neon-glow-container::before {
      content: '';
      position: absolute;
      inset: -2px;
      background: linear-gradient(180deg, rgba(0, 255, 136, 0.4), rgba(16, 185, 129, 0.1), transparent);
      border-radius: 1rem;
      filter: blur(16px);
      z-index: -1;
      opacity: 0.8;
      pointer-events: none;
    }
  </style>

<body class="font-inter text-on-surface antialiased min-h-screen flex flex-col justify-between relative overflow-x-hidden">

    <div class="aurora-orb-1"></div>
    <div class="aurora-orb-2"></div>

  <!-- Main Login Container -->
  <main class="flex-grow flex items-center justify-center px-4 sm:px-margin py-8 relative z-10">
    <div class="w-full max-w-md">
      
      <!-- Welcome Section Container -->
      <div class="text-center mb-1 flex flex-col items-center">
        <!-- Financial Network 3D Animation Container -->
        <div id="particle-moon-container" class="w-48 h-48 sm:w-56 sm:h-56 mb-2 relative flex items-center justify-center overflow-visible"></div>
        <!-- Teks "Welcome" -->
        <h1 class="font-space-grotesk text-[32px] md:text-[38px] text-on-surface tracking-wide font-bold leading-none drop-shadow-md mb-2">Welcome</h1>
        <!-- CUSTOM SUBTITLE -->
        <p class="font-sora text-[11px] text-on-surface-variant mb-8">Begin your transaction journey with us</p>
      </div>

      <!-- Login Card dengan Cahaya Neon Hijau di Belakang -->
      <div class="card-neon-glow-container">
        <div class="bg-surface-container-lowest/80 backdrop-blur-md rounded-2xl p-space-lg shadow-[0_20px_50px_rgba(0,0,0,0.9)] border border-outline relative">
          <div class="absolute -top-px -left-px -right-px h-[2px] bg-gradient-to-r from-transparent via-primary to-transparent rounded-t-2xl"></div>
          
          <!-- Login Form -->
          <form id="login-form" class="w-full space-y-3" onsubmit="return false;">
            
            <!-- Error Message Banner (Styled to match design) -->
            <div id="error-banner" class="hidden items-center gap-2 p-2.5 rounded-lg bg-error-container/40 border border-error/40 text-error text-[11px] font-sora transition-all animate-shake">
              <span class="material-symbols-outlined text-[16px]">error</span>
              <span id="error-text">Invalid email or password</span>
            </div>

            <!-- Email Input with Mail Icon -->
            <div class="relative">
              <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-secondary">
                <span class="material-symbols-outlined text-[18px]">mail</span>
              </span>
              <input id="email-input" class="w-full h-10 pl-10 pr-3 rounded-lg bg-surface-container-low border border-outline text-on-surface placeholder:text-surface-variant/50 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all text-xs font-sora" placeholder="Email address" type="email" autocomplete="off" required/>
            </div>

            <!-- Password Input with Lock & Visibility Icons -->
            <div class="relative">
              <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-secondary">
                <span class="material-symbols-outlined text-[18px]">lock</span>

            <div>
              <div class="flex justify-between items-center text-[11px] font-sora">

            <button class="w-full py-space-md px-space-md rounded-lg bg-primary text-on-primary font-label-lg text-label-lg hover:bg-primary-container transition-colors shadow-[0_0_20px_rgba(0,255,136,0.25)] font-bold cursor-pointer flex items-center justify-center text-sm mt-1 font-sora" type="submit">Sign in</button>

  <!-- Three.js Ambient Lighting & Particle Animation Scripts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
  <script>
    const container = document.getElementById('particle-moon-container');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(50, container.clientWidth / container.clientHeight, 0.1, 1000);
    camera.position.z = 5.2;

    const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    const networkGroup = new THREE.Group();
    scene.add(networkGroup);

    const nodeCount = 38;
    const nodes = [];
    const nodePositions = [];
    const maxConnectionDistance = 1.6;

    for (let i = 0; i < nodeCount; i++) {
      const u = Math.random();
      const v = Math.random();
      const theta = u * 2.0 * Math.PI;
      const phi = Math.acos(2.0 * v - 1.0);
      const r = Math.cbrt(Math.random()) * 1.8;

      const sinPhi = Math.sin(phi);
      const x = r * sinPhi * Math.cos(theta);
      const y = r * sinPhi * Math.sin(theta);
      const z = r * Math.cos(phi);

      nodes.push({
        basePos: new THREE.Vector3(x, y, z),
        currentPos: new THREE.Vector3(x, y, z),
        phase: Math.random() * Math.PI * 2
      });
      nodePositions.push(x, y, z);
    }

    const nodeGeo = new THREE.BufferGeometry();
    nodeGeo.setAttribute('position', new THREE.Float32BufferAttribute(nodePositions, 3));

    const canvasN = document.createElement('canvas');
    canvasN.width = 64;
    canvasN.height = 64;
    const ctxN = canvasN.getContext('2d');
    let gradN = ctxN.createRadialGradient(32, 32, 0, 32, 32, 32);
    gradN.addColorStop(0, 'rgba(255,255,255,1)');
    gradN.addColorStop(0.4, 'rgba(110,231,183,0.9)');
    gradN.addColorStop(1, 'rgba(6,78,59,0)');
    ctxN.fillStyle = gradN;
    ctxN.fillRect(0, 0, 64, 64);

    const nodeTexture = new THREE.CanvasTexture(canvasN);
    const nodeMat = new THREE.PointsMaterial({
      size: 0.16,
      map: nodeTexture,
      transparent: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });

    const nodePoints = new THREE.Points(nodeGeo, nodeMat);
    networkGroup.add(nodePoints);

    const lineGeo = new THREE.BufferGeometry();
    const lineMat = new THREE.LineBasicMaterial({
      color: 0x10B981,
      transparent: true,
      opacity: 0.3,
      blending: THREE.AdditiveBlending
    });
    const lineSegments = new THREE.LineSegments(lineGeo, lineMat);
    networkGroup.add(lineSegments);

    const pulseCount = 22;
    const pulseGeo = new THREE.BufferGeometry();
    const pulsePositions = new Float32Array(pulseCount * 3);
    for (let i = 0; i < pulseCount * 3; i++) pulsePositions[i] = 0;
    pulseGeo.setAttribute('position', new THREE.BufferAttribute(pulsePositions, 3));

    const pulseMat = new THREE.PointsMaterial({
      size: 0.13,
      map: nodeTexture,
      color: 0x6EE7B7,
      transparent: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });
    const pulsePoints = new THREE.Points(pulseGeo, pulseMat);
    networkGroup.add(pulsePoints);

    let clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      let elapsedTime = clock.getElapsedTime();

      networkGroup.rotation.y = elapsedTime * 0.12;
      networkGroup.rotation.x = Math.sin(elapsedTime * 0.18) * 0.12;

      const posArray = nodeGeo.attributes.position.array;
      nodes.forEach((node, i) => {
        node.currentPos.x = node.basePos.x + Math.sin(elapsedTime * 0.7 + node.phase) * 0.15;
        node.currentPos.y = node.basePos.y + Math.cos(elapsedTime * 0.6 + node.phase) * 0.15;
        node.currentPos.z = node.basePos.z + Math.sin(elapsedTime * 0.5 + node.phase) * 0.15;

        posArray[i * 3] = node.currentPos.x;
        posArray[i * 3 + 1] = node.currentPos.y;
        posArray[i * 3 + 2] = node.currentPos.z;
      });
      nodeGeo.attributes.position.needsUpdate = true;

      const linePositions = [];
      for (let i = 0; i < nodes.length; i++) {
        for (let j = i + 1; j < nodes.length; j++) {
          const dist = nodes[i].currentPos.distanceTo(nodes[j].currentPos);
          if (dist < maxConnectionDistance) {
            linePositions.push(
              nodes[i].currentPos.x, nodes[i].currentPos.y, nodes[i].currentPos.z,
              nodes[j].currentPos.x, nodes[j].currentPos.y, nodes[j].currentPos.z
            );
          }
        }
      }
      lineGeo.setAttribute('position', new THREE.Float32BufferAttribute(linePositions, 3));

      const pulsePosArray = pulseGeo.attributes.position.array;
      for (let i = 0; i < pulseCount; i++) {
        let n1 = nodes[i % nodes.length].currentPos;
        let n2 = nodes[(i + 7) % nodes.length].currentPos;
        let lerpFactor = (Math.sin(elapsedTime * 1.2 + i) + 1) / 2;
        pulsePosArray[i * 3] = THREE.MathUtils.lerp(n1.x, n2.x, lerpFactor);
        pulsePosArray[i * 3 + 1] = THREE.MathUtils.lerp(n1.y, n2.y, lerpFactor);
        pulsePosArray[i * 3 + 2] = THREE.MathUtils.lerp(n1.z, n2.z, lerpFactor);
      }
      pulseGeo.attributes.position.needsUpdate = true;

      renderer.render(scene, camera);
    }
    animate();

    const resizeObserver = new ResizeObserver(entries => {
      for (let entry of entries) {
        const width = entry.contentRect.width;
        const height = entry.contentRect.height;
        if (width > 0 && height > 0) {
          camera.aspect = width / height;
          camera.updateProjectionMatrix();
          renderer.setSize(width, height);
        }
      }
    });
    resizeObserver.observe(container);

    function togglePassword() {
      const passwordInput = document.getElementById('password-input');
      const toggleIcon = document.getElementById('toggle-icon');
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        toggleIcon.textContent = 'visibility_off';
      } else {
        passwordInput.type = 'password';
        toggleIcon.textContent = 'visibility';
      }
    }
  </script>

    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {

      authDomain: "allena-admin.firebaseapp.com",
      databaseURL: "https://allena-admin-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "allena-admin",
      storageBucket: "allena-admin.firebasestorage.app",
      messagingSenderId: "529498448950",
      appId: "1:529498448950:web:6a836ae249353dcb796497",

    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const form = document.getElementById("login-form");
    const errorBanner = document.getElementById("error-banner");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      event.stopImmediatePropagation();

      // Reset error state
      errorBanner.classList.add("hidden");
      errorBanner.classList.remove("flex");

      const email = document.getElementById("email-input").value.trim();
      const password = document.getElementById("password-input").value;

      try {
        await signInWithEmailAndPassword(auth, email, password);
        window.location.href = "../dashboard/index.html";
      } catch (error) {
        console.error(error);
        // Show styled inline error banner instead of alert
        errorBanner.classList.remove("hidden");
        errorBanner.classList.add("flex");
      }
    });
