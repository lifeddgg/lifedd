  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>

  <script>
    const container = document.getElementById('particle-moon-container');
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(
      50,
      container.clientWidth / container.clientHeight,
      0.1,
      1000
    );

    camera.position.z = 5.2;

    const renderer = new THREE.WebGLRenderer({
      alpha: true,
      antialias: true
    });

    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    const networkGroup = new THREE.Group();
    scene.add(networkGroup);

    const nodeCount = 38;
    const nodes = [];
    const nodePositions = [];
    const maxConnectionDistance = 1.6;

    for (let i = 0; i < nodeCount; i++) {
      const u = Math.random();
      const v = Math.random();
      const theta = u * 2.0 * Math.PI;
      const phi = Math.acos(2.0 * v - 1.0);
      const r = Math.cbrt(Math.random()) * 1.8;

      const sinPhi = Math.sin(phi);
      const x = r * sinPhi * Math.cos(theta);
      const y = r * sinPhi * Math.sin(theta);
      const z = r * Math.cos(phi);

      nodes.push({
        basePos: new THREE.Vector3(x, y, z),
        currentPos: new THREE.Vector3(x, y, z),
        phase: Math.random() * Math.PI * 2
      });

      nodePositions.push(x, y, z);
    }

    const nodeGeo = new THREE.BufferGeometry();

    nodeGeo.setAttribute(
      'position',
      new THREE.Float32BufferAttribute(nodePositions, 3)
    );

    const canvasN = document.createElement('canvas');
    canvasN.width = 64;
    canvasN.height = 64;

    const ctxN = canvasN.getContext('2d');
    const gradN = ctxN.createRadialGradient(32, 32, 0, 32, 32, 32);

    gradN.addColorStop(0, 'rgba(255,255,255,1)');
    gradN.addColorStop(0.4, 'rgba(110,231,183,0.9)');
    gradN.addColorStop(1, 'rgba(6,78,59,0)');

    ctxN.fillStyle = gradN;
    ctxN.fillRect(0, 0, 64, 64);

    const nodeTexture = new THREE.CanvasTexture(canvasN);

    const nodeMat = new THREE.PointsMaterial({
      size: 0.16,
      map: nodeTexture,
      transparent: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });

    const nodePoints = new THREE.Points(nodeGeo, nodeMat);
    networkGroup.add(nodePoints);

    const lineGeo = new THREE.BufferGeometry();

    const lineMat = new THREE.LineBasicMaterial({
      color: 0x10B981,
      transparent: true,
      opacity: 0.3,
      blending: THREE.AdditiveBlending
    });

    const lineSegments = new THREE.LineSegments(lineGeo, lineMat);
    networkGroup.add(lineSegments);

    const pulseCount = 22;
    const pulseGeo = new THREE.BufferGeometry();
    const pulsePositions = new Float32Array(pulseCount * 3);

    for (let i = 0; i < pulseCount * 3; i++) {
      pulsePositions[i] = 0;
    }

    pulseGeo.setAttribute(
      'position',
      new THREE.BufferAttribute(pulsePositions, 3)
    );

    const pulseMat = new THREE.PointsMaterial({
      size: 0.13,
      map: nodeTexture,
      color: 0x6EE7B7,
      transparent: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });

    const pulsePoints = new THREE.Points(pulseGeo, pulseMat);
    networkGroup.add(pulsePoints);

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const elapsedTime = clock.getElapsedTime();

      networkGroup.rotation.y = elapsedTime * 0.12;
      networkGroup.rotation.x = Math.sin(elapsedTime * 0.18) * 0.12;

      const posArray = nodeGeo.attributes.position.array;

      nodes.forEach((node, i) => {
        node.currentPos.x =
          node.basePos.x + Math.sin(elapsedTime * 0.7 + node.phase) * 0.15;

        node.currentPos.y =
          node.basePos.y + Math.cos(elapsedTime * 0.6 + node.phase) * 0.15;

        node.currentPos.z =
          node.basePos.z + Math.sin(elapsedTime * 0.5 + node.phase) * 0.15;

        posArray[i * 3] = node.currentPos.x;
        posArray[i * 3 + 1] = node.currentPos.y;
        posArray[i * 3 + 2] = node.currentPos.z;
      });

      nodeGeo.attributes.position.needsUpdate = true;

      const linePositions = [];

      for (let i = 0; i < nodes.length; i++) {
        for (let j = i + 1; j < nodes.length; j++) {
          const dist = nodes[i].currentPos.distanceTo(
            nodes[j].currentPos
          );

          if (dist < maxConnectionDistance) {
            linePositions.push(
              nodes[i].currentPos.x,
              nodes[i].currentPos.y,
              nodes[i].currentPos.z,
              nodes[j].currentPos.x,
              nodes[j].currentPos.y,
              nodes[j].currentPos.z
            );
          }
        }
      }

      lineGeo.setAttribute(
        'position',
        new THREE.Float32BufferAttribute(linePositions, 3)
      );

      const pulsePosArray = pulseGeo.attributes.position.array;

      for (let i = 0; i < pulseCount; i++) {
        const n1 = nodes[i % nodes.length].currentPos;
        const n2 = nodes[(i + 7) % nodes.length].currentPos;

        const lerpFactor =
          (Math.sin(elapsedTime * 1.2 + i) + 1) / 2;

        pulsePosArray[i * 3] =
          THREE.MathUtils.lerp(n1.x, n2.x, lerpFactor);

        pulsePosArray[i * 3 + 1] =
          THREE.MathUtils.lerp(n1.y, n2.y, lerpFactor);

        pulsePosArray[i * 3 + 2] =
          THREE.MathUtils.lerp(n1.z, n2.z, lerpFactor);
      }

      pulseGeo.attributes.position.needsUpdate = true;
      renderer.render(scene, camera);
    }

    animate();

    const resizeObserver = new ResizeObserver(entries => {
      for (const entry of entries) {
        const width = entry.contentRect.width;
        const height = entry.contentRect.height;

        if (width > 0 && height > 0) {
          camera.aspect = width / height;
          camera.updateProjectionMatrix();
          renderer.setSize(width, height);
        }
      }
    });

    resizeObserver.observe(container);

    function togglePassword(inputId, iconId) {
      const passwordInput = document.getElementById(inputId);
      const toggleIcon = document.getElementById(iconId);

      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        toggleIcon.textContent = 'visibility_off';
      } else {
        passwordInput.type = 'password';
        toggleIcon.textContent = 'visibility';
      }
    }
  </script>

        "auth/invalid-email": "Please enter a valid email address.",
        "auth/weak-password": "Your password is too weak. Use at least 6 characters.",
        "auth/operation-not-allowed": "Email/Password registration is not enabled in Firebase.",
        "auth/network-request-failed": "Network error. Please check your internet connection.",
        "auth/too-many-requests": "Too many attempts. Please wait and try again."
      };

      return messages[error.code] || "Registration failed. Please try again. Error: " + (error.code || error.message || "Unknown error");
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      if (!form.reportValidity()) {
        return;
      }

      const fullName = document.getElementById("full-name").value.trim();
      const businessName = document.getElementById("business-name").value.trim();
      const email = document.getElementById("email").value.trim();
      const businessType = document.getElementById("business-type").value;
      const password = document.getElementById("password-input").value;
      const confirmPassword = document.getElementById("confirm-password-input").value;
      const termsAccepted = document.getElementById("terms").checked;

      if (!fullName || !businessName || !email || !businessType) {
        showStatus("Please complete all required fields.", true);
        return;
      }

      if (password !== confirmPassword) {
        showStatus("Passwords do not match.", true);
        document.getElementById("confirm-password-input").focus();
        return;
      }

      if (password.length < 6) {
        showStatus("Password must contain at least 6 characters.", true);
        return;
      }

      if (!termsAccepted) {
        showStatus("Please agree to the Terms of Service and Privacy Policy.", true);
        return;
      }

      submitButton.disabled = true;
      submitButton.textContent = "Creating account...";
      showStatus("Creating your KIRA account...");

      let user = null;

      try {
        if (
          auth.currentUser &&
          auth.currentUser.email &&
          auth.currentUser.email.toLowerCase() === email.toLowerCase()
        ) {
          user = auth.currentUser;
        } else {
          const credential = await createUserWithEmailAndPassword(
            auth,
            email,
            password
          );
          user = credential.user;
        }

        await updateProfile(user, {
          displayName: fullName
        });

        showStatus("Saving your business profile...");

        await set(ref(db, `users/${user.uid}`), {
          uid: user.uid,
          fullName: fullName,
          businessName: businessName,
          email: user.email,
          businessType: businessType,
          country: "Brunei Darussalam",
          currency: "BND",
          createdAt: serverTimestamp()
        });

        showStatus("Account created successfully. Opening dashboard...");

        window.location.href = "../dashboard/index.html";

      } catch (error) {
        console.error("KIRA signup error:", error);

        if (user && error.code !== "auth/email-already-in-use") {
          showStatus(
            "Your account may already exist, but saving the profile failed. Please check your connection and Database Rules.",
            true
          );
        } else {
          showStatus(getFriendlyError(error), true);
        }

        submitButton.disabled = false;
        submitButton.textContent = "Create account";
      }
    });
  </script>

</body>
</html>
